<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservá tu cancha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f9fb;--s:#fff;--b:#e3e8ee;--c:#cfd6de;--t:#10161d;--m:#5b6672;--a:#0a5cb5;--soft:#eef5fc;--trk:#d3e4f6;--n:#c4242a}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--t);font:400 15px/22px "DM Sans",Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:16px}
.box{max-width:600px;margin:2vh auto;background:var(--s);border:1px solid var(--b);border-radius:8px;padding:24px;display:grid;gap:16px}
h1{font-size:24px;line-height:30px;font-weight:700}h1 svg{vertical-align:-6px;margin-right:10px}h3{font-size:18px;font-weight:600}p,.m{color:var(--m)}
button,input{font:inherit;color:var(--t);background:var(--s);border:1px solid var(--c);border-radius:6px;height:40px;padding:0 14px;cursor:pointer}button:hover:not(:disabled){background:var(--soft);border-color:var(--a)}
button:disabled{color:#9aa3ad;background:#f1f4f7;border-color:#f1f4f7;cursor:not-allowed;text-decoration:line-through}button.p{background:var(--t);color:#fff;border-color:var(--t)}
:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.days button{flex:none;height:48px;line-height:16px;font-size:13px}.days button.on{background:var(--a);color:#fff;border-color:var(--a)}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--b);padding-top:12px}.r b{width:52px;font-weight:600}
dialog{border:1px solid var(--b);border-radius:12px;padding:24px;width:min(92%,400px);box-shadow:0 8px 24px #0002}dialog::backdrop{background:#10161d55}
form{display:grid;gap:12px;margin-top:12px}input{width:100%}#err{color:var(--n)}
.top{max-width:600px;margin:0 auto 12px;display:flex;gap:6px}.top button.on{background:var(--t);color:#fff;border-color:var(--t)}
.box[hidden]{display:none}#tn{max-width:960px}.tc{display:grid;gap:2px;width:100%;text-align:left;height:auto;padding:12px 14px}.tc b{font-weight:600}
</style></head><body><div class="top"><button class="on" data-v="b">Reservar cancha</button><button data-v="tn">Torneos</button></div>
<div class="box" id="b">Cargando…</div><div class="box tv" id="tn" hidden></div><dialog id="d"></dialog>
<script src="../config.js"></script>
<script src="../torneos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const{SB_URL,SB_KEY,WA}=window.CFG,sb=supabase.createClient(SB_URL,SB_KEY),$=s=>document.querySelector(s),TZ="America/Argentina/Cordoba";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+Number(n||0).toLocaleString("es-AR",{maximumFractionDigits:0});
const hm=m=>String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const iso=(d,m)=>`${d}T${hm(m)}:00-03:00`;
const slots=c=>{const r=[];for(let m=c.apertura*60;m+c.duracion<=c.cierre*60;m+=c.duracion)r.push(m);return r};
const dstr=i=>new Date(Date.now()+i*864e5).toLocaleDateString("en-CA",{timeZone:TZ});
const dlab=d=>new Date(d+"T12:00:00").toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"numeric"});
let CF,K=[],dia,ocu=new Set();
(async()=>{const[a,b]=await Promise.all([sb.from("config").select("*").single(),sb.from("canchas").select("*").eq("activa",true).order("nombre")]);
 if(a.error)return $("#b").textContent="No se pudo cargar. Revisá config.js y supabase.sql.";
 CF=a.data;K=b.data||[];dia=dstr(0);draw()})();
async function draw(){
 const{data}=await sb.rpc("disponibilidad",{p_fecha:dia});ocu=new Set((data||[]).map(o=>o.cancha_id+"|"+new Date(o.inicio).getTime()));
 $("#b").innerHTML=`<h1><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#0a5cb5"/><path d="M3.5 8.5c5.5 0 9.5 4 9.5 11.5M20.5 15.5C15 15.5 11 11.5 11 4" stroke="#fff" fill="none" stroke-width="1.6"/></svg>${esc(CF.nombre)}</h1><p>Elegí día, horario y cancha. Turnos de ${CF.duracion} min · ${money(CF.precio)}. Se paga en el complejo.</p>
 <div class="days">${Array.from({length:CF.dias_adelante},(_,i)=>dstr(i)).map(d=>`<button data-d="${d}" class="${d===dia?"on":""}">${dlab(d)}</button>`).join("")}</div>
 ${slots(CF).map(m=>`<div class="r"><b>${hm(m)}</b>${K.map(k=>{const t=+new Date(iso(dia,m)),off=t<Date.now()||ocu.has(k.id+"|"+t);
  return`<button ${off?"disabled":""} data-k="${k.id}" data-m="${m}">${esc(k.nombre)}</button>`}).join("")}</div>`).join("")}`;
 $("#b").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{dia=b.dataset.d;draw()});
 $("#b").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>pedir(b.dataset.k,+b.dataset.m))}
function pedir(kid,m){const k=K.find(x=>x.id===kid),d=$("#d");
 d.innerHTML=`<h3>${esc(k.nombre)} · ${dlab(dia)} ${hm(m)}</h3><form><input name="n" placeholder="Nombre y apellido" autocomplete="name" required>
 <input name="t" inputmode="tel" placeholder="WhatsApp (ej: 3534123456)" required><span id="err"></span>
 <button class="p">Confirmar reserva</button><button type="button" data-x>Cancelar</button></form>`;
 d.querySelector("[data-x]").onclick=()=>d.close();
 d.querySelector("form").onsubmit=async e=>{e.preventDefault();const f=e.target,btn=f.querySelector(".p");btn.disabled=true;btn.textContent="Reservando…";
  const{error}=await sb.rpc("reservar",{p_cancha:kid,p_inicio:iso(dia,m),p_nombre:f.n.value,p_telefono:f.t.value});
  if(error){$("#err").textContent=error.message;btn.disabled=false;btn.textContent="Confirmar reserva";if(/ocup/.test(error.message))setTimeout(()=>{d.close();draw()},1500);return}
  d.close();const msg=`Hola, soy ${f.n.value}. Reservé ${k.nombre} el ${dlab(dia)} a las ${hm(m)}.`;
  $("#b").innerHTML=`<h1>¡Turno reservado!</h1><p>${esc(k.nombre)} · ${dlab(dia)} a las ${hm(m)}. Te esperamos.</p>
  <a href="https://wa.me/${WA}?text=${encodeURIComponent(msg)}"><button class="p" style="width:100%">Avisar por WhatsApp</button></a><button onclick="draw()">Reservar otro</button>`}
 d.showModal()}

document.querySelectorAll(".top button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".top button").forEach(x=>x.classList.toggle("on",x===b));$("#b").hidden=b.dataset.v!=="b";$("#tn").hidden=b.dataset.v!=="tn";document.querySelector(".top").style.maxWidth=b.dataset.v==="tn"?"960px":"600px";if(b.dataset.v==="tn")loadT()});
let TT=[],tsel=null;const TLAB={inscripcion:"Inscripción abierta",en_juego:"En juego",finalizado:"Finalizado"},GL={masculino:"Masculino",femenino:"Femenino",mixto:"Mixto"};
async function loadT(){const{data}=await sb.from("torneos").select("*").order("created_at",{ascending:false});TT=data||[];if(tsel&&!TT.some(x=>x.id===tsel))tsel=null;showT()}
async function showT(){const box=$("#tn"),t=TT.find(x=>x.id===tsel);
 if(!TT.length){box.innerHTML=`<h1>Torneos</h1><p>Por ahora no hay torneos publicados.</p>`;return}
 if(!t){box.innerHTML=`<h1>Torneos</h1>`+TT.map(x=>`<button class="tc" data-t="${x.id}"><b>${esc(x.nombre)}</b><span class="m">${GL[x.genero]} · ${esc(x.categoria)} · ${TLAB[x.estado]}</span></button>`).join("");box.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tsel=b.dataset.t;showT()});return}
 const[a,c]=await Promise.all([sb.from("torneo_parejas").select("id,jugador1,jugador2,grupo").eq("torneo_id",t.id),sb.from("torneo_partidos").select("*").eq("torneo_id",t.id).order("ronda").order("pos")]);
 const P=a.data||[],M=c.data||[],G=TV.grupos(t,P,M),LL=TV.llave(M,P),f=x=>new Date(x+"T12:00:00").toLocaleDateString("es-AR",{day:"numeric",month:"long"});
 box.innerHTML=`<div><button id="tb">Todos los torneos</button></div><h1>${esc(t.nombre)}</h1><p>${GL[t.genero]} · ${esc(t.categoria)} · ${TLAB[t.estado]}${t.fecha_inicio?" · desde el "+f(t.fecha_inicio):""}${t.fecha_fin?" hasta el "+f(t.fecha_fin):""}</p>
 ${t.reglas?`<div><h3>Reglas</h3><p style="white-space:pre-wrap;color:var(--t)">${esc(t.reglas)}</p></div>`:""}${TV.campeon(M,P)}
 ${G?`<h3>Fase de grupos</h3>${G}<p class="m">Victoria suma 2 puntos. La marca azul indica quiénes clasifican.</p>`:""}${LL?`<h3>Cruces</h3>${LL}`:""}${!G&&!LL?`<p>El fixture se publica cuando cierre la inscripción.</p>`:""}`;
 $("#tb").onclick=()=>{tsel=null;showT()}}
setInterval(()=>{if(!$("#tn").hidden&&tsel)showT()},45000);
</script></body></html>
